<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#FFB88C" />
<title>Idiot Wolf</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&family=Fredoka:wght@600;700&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    background: #2a1810;
    overflow: hidden;
    font-family: "Nunito", system-ui, -apple-system, sans-serif;
    color: #3D2817;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
  }
  body {
    display: flex; align-items: center; justify-content: center;
    position: fixed; inset: 0;
  }
  #stage {
    position: relative;
    width: 100vw; height: 100vh;
    max-width: calc(100vh * (16/9));
    max-height: calc(100vw * (9/16));
    background: #FFB88C;
    overflow: hidden;
    box-shadow: 0 0 40px rgba(0,0,0,0.4);
  }
  canvas#game {
    display: block; width: 100%; height: 100%;
    touch-action: none;
    image-rendering: optimizeQuality;
  }

  /* === HUD === */
  #hud {
    position: absolute; inset: 0;
    pointer-events: none;
    font-family: "Nunito", system-ui, sans-serif;
    font-weight: 900;
    color: #3D2817;
    text-shadow: 0 1px 0 rgba(255,255,255,0.4);
  }
  #hud .top-left {
    position: absolute; top: clamp(8px, 1.6vh, 18px); left: clamp(10px, 1.8vw, 22px);
    background: rgba(255, 227, 179, 0.55);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    padding: 8px 14px;
    border-radius: 14px;
    font-size: clamp(12px, 2vh, 18px);
    letter-spacing: 0.02em;
    display: flex; gap: clamp(8px, 1.5vw, 18px); align-items: center;
    line-height: 1;
    box-shadow: 0 2px 0 rgba(61,40,23,0.12);
  }
  #hud .top-left .sep { opacity: 0.4; }
  #hud .top-right {
    position: absolute; top: clamp(8px, 1.6vh, 18px); right: clamp(10px, 1.8vw, 22px);
    display: flex; gap: 10px; align-items: center;
    pointer-events: auto;
  }
  #mute-btn {
    background: rgba(255, 227, 179, 0.55);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    border: none;
    width: clamp(36px, 5vh, 44px); height: clamp(36px, 5vh, 44px);
    border-radius: 50%;
    font-size: clamp(16px, 2.4vh, 22px);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 2px 0 rgba(61,40,23,0.12);
    transition: transform 0.1s ease;
  }
  #mute-btn:active { transform: scale(0.92); }
  #powerup-indicator {
    background: rgba(255, 227, 179, 0.55);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    padding: 8px 12px;
    border-radius: 14px;
    display: none;
    align-items: center;
    gap: 8px;
    font-weight: 900;
    box-shadow: 0 2px 0 rgba(61,40,23,0.12);
  }
  #powerup-indicator.active { display: flex; }
  #powerup-icon { font-size: clamp(18px, 2.6vh, 24px); line-height: 1; }
  #powerup-bar {
    width: clamp(60px, 10vw, 90px); height: 8px;
    background: rgba(61,40,23,0.18);
    border-radius: 4px;
    overflow: hidden;
  }
  #powerup-bar-fill {
    height: 100%; width: 100%;
    background: linear-gradient(90deg, #FFB88C, #A04030);
    transition: width 0.1s linear;
  }

  /* === Milestone floater === */
  #milestone {
    position: absolute;
    top: 38%; left: 50%;
    transform: translate(-50%, -50%) scale(0.6);
    font-family: "Fredoka", "Nunito", system-ui, sans-serif;
    font-weight: 700;
    font-size: clamp(22px, 4.5vh, 42px);
    color: #3D2817;
    text-shadow: 0 2px 0 rgba(255,255,255,0.5), 0 4px 12px rgba(0,0,0,0.15);
    background: rgba(255, 227, 179, 0.7);
    padding: 14px 28px;
    border-radius: 24px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease, transform 0.3s cubic-bezier(.34,1.56,.64,1);
    white-space: nowrap;
  }
  #milestone.show {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }

  /* === Touch controls === */
  #touch-controls {
    position: absolute; inset: 0;
    pointer-events: none;
    display: none;
  }
  body.touch #touch-controls { display: block; }
  .touch-btn {
    position: absolute;
    background: rgba(255, 227, 179, 0.4);
    border: 2px solid rgba(61,40,23,0.25);
    border-radius: 50%;
    pointer-events: auto;
    display: flex; align-items: center; justify-content: center;
    font-size: clamp(24px, 5vh, 36px);
    font-weight: 900;
    color: #3D2817;
    user-select: none; -webkit-user-select: none;
    touch-action: none;
    transition: transform 0.05s ease, background 0.05s ease;
  }
  .touch-btn.pressed {
    background: rgba(255, 227, 179, 0.75);
    transform: scale(0.92);
  }
  #btn-left  { left: clamp(14px, 3vw, 28px); bottom: clamp(14px, 3vh, 28px); width: clamp(64px, 10vh, 92px); height: clamp(64px, 10vh, 92px); }
  #btn-right { left: calc(clamp(14px, 3vw, 28px) + clamp(64px, 10vh, 92px) + 12px); bottom: clamp(14px, 3vh, 28px); width: clamp(64px, 10vh, 92px); height: clamp(64px, 10vh, 92px); }
  #btn-jump  { right: clamp(14px, 3vw, 28px); bottom: clamp(14px, 3vh, 28px); width: clamp(84px, 14vh, 120px); height: clamp(84px, 14vh, 120px); }

  /* === Overlays (start / death / pause) === */
  .overlay {
    position: absolute; inset: 0;
    display: none;
    flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center;
    padding: 24px;
    z-index: 10;
  }
  .overlay.show { display: flex; }

  #start-screen {
    background: linear-gradient(180deg, #FFB88C 0%, #FFE3B3 60%, #5BA8A0 100%);
  }
  #start-screen .title {
    font-family: "Fredoka", "Nunito", system-ui, sans-serif;
    font-weight: 700;
    font-size: clamp(48px, 12vh, 110px);
    color: #3D2817;
    letter-spacing: -0.02em;
    line-height: 0.95;
    text-shadow: 0 4px 0 rgba(255,255,255,0.35), 0 8px 24px rgba(0,0,0,0.18);
    margin-bottom: 8px;
    transform: rotate(-2deg);
  }
  #start-screen .tagline {
    font-family: "Nunito", system-ui, sans-serif;
    font-weight: 700;
    font-size: clamp(14px, 2.4vh, 22px);
    color: #A04030;
    margin-bottom: 32px;
    max-width: 600px;
    font-style: italic;
  }
  .big-btn {
    font-family: "Fredoka", "Nunito", system-ui, sans-serif;
    font-weight: 700;
    font-size: clamp(20px, 3.4vh, 30px);
    padding: 16px 40px;
    background: #3D2817;
    color: #FFE3B3;
    border: none;
    border-radius: 999px;
    cursor: pointer;
    letter-spacing: 0.04em;
    box-shadow: 0 6px 0 #2a1810, 0 12px 24px rgba(0,0,0,0.25);
    transition: transform 0.08s ease, box-shadow 0.08s ease;
  }
  .big-btn:active {
    transform: translateY(4px);
    box-shadow: 0 2px 0 #2a1810, 0 4px 8px rgba(0,0,0,0.2);
  }
  #start-screen .hint {
    margin-top: 28px;
    font-size: clamp(11px, 1.8vh, 15px);
    color: rgba(61,40,23,0.7);
    font-weight: 700;
  }

  #death-screen {
    background: rgba(60, 30, 20, 0.78);
    color: #FFE3B3;
  }
  #death-screen .epitaph {
    font-family: "Fredoka", "Nunito", system-ui, sans-serif;
    font-weight: 700;
    font-size: clamp(28px, 6vh, 56px);
    color: #FFE3B3;
    text-shadow: 0 2px 8px rgba(0,0,0,0.4);
    margin-bottom: 12px;
    letter-spacing: -0.01em;
  }
  #death-screen .sub-epitaph {
    font-family: "Nunito", system-ui, sans-serif;
    font-style: italic;
    font-weight: 700;
    font-size: clamp(14px, 2.4vh, 22px);
    color: #FFB88C;
    margin-bottom: 24px;
    max-width: 600px;
  }
  #death-screen .stats {
    font-family: "Nunito", system-ui, sans-serif;
    font-weight: 900;
    font-size: clamp(14px, 2.2vh, 20px);
    color: #FFE3B3;
    margin-bottom: 32px;
    display: flex; gap: 18px;
    flex-wrap: wrap; justify-content: center;
  }
  #death-screen .stats .sep { opacity: 0.4; }
  #death-screen .hint {
    margin-top: 20px;
    font-size: clamp(11px, 1.8vh, 14px);
    color: rgba(255,227,179,0.6);
    font-weight: 700;
  }

  #pause-screen {
    background: rgba(60, 30, 20, 0.55);
    color: #FFE3B3;
  }
  #pause-screen .pause-text {
    font-family: "Fredoka", "Nunito", system-ui, sans-serif;
    font-weight: 700;
    font-size: clamp(40px, 8vh, 80px);
    color: #FFE3B3;
    margin-bottom: 24px;
    letter-spacing: 0.08em;
  }
  #pause-screen .hint {
    margin-top: 18px;
    font-size: clamp(11px, 1.8vh, 14px);
    color: rgba(255,227,179,0.6);
    font-weight: 700;
  }
</style>
</head>
<body>
  <div id="stage">
    <canvas id="game" width="960" height="540"></canvas>

    <div id="hud">
      <div class="top-left">
        <span>SCORE <span id="hud-score">0</span></span>
        <span class="sep">·</span>
        <span>BEST <span id="hud-best">0</span></span>
        <span class="sep">·</span>
        <span>📏 <span id="hud-dist">0</span>m</span>
      </div>
      <div class="top-right">
        <div id="powerup-indicator">
          <span id="powerup-icon">🐎</span>
          <div id="powerup-bar"><div id="powerup-bar-fill"></div></div>
        </div>
        <button id="mute-btn" aria-label="Mute toggle">🔊</button>
      </div>
    </div>

    <div id="milestone"></div>

    <div id="touch-controls">
      <div id="btn-left" class="touch-btn">◀</div>
      <div id="btn-right" class="touch-btn">▶</div>
      <div id="btn-jump" class="touch-btn">⤴</div>
    </div>

    <div id="start-screen" class="overlay show">
      <div class="title">idiot wolf</div>
      <div class="tagline" id="start-tagline">Slack is open. The dread is real.</div>
      <button class="big-btn" id="start-btn">begin the day</button>
      <div class="hint" id="start-hint">arrows / WASD to move · space to jump · P to pause</div>
    </div>

    <div id="death-screen" class="overlay">
      <div class="epitaph">another day, another battle</div>
      <div class="sub-epitaph" id="death-sub">you almost had it (you didn't)</div>
      <div class="stats">
        <span>Score <span id="death-score">0</span></span>
        <span class="sep">·</span>
        <span>Best <span id="death-best">0</span></span>
        <span class="sep">·</span>
        <span>📏 <span id="death-dist">0</span>m</span>
      </div>
      <button class="big-btn" id="restart-btn">try again</button>
      <div class="hint">or press R</div>
    </div>

    <div id="pause-screen" class="overlay">
      <div class="pause-text">paused</div>
      <button class="big-btn" id="resume-btn">resume</button>
      <div class="hint">or press P / Esc · tap anywhere</div>
    </div>
  </div>

<script>
"use strict";

// ============================================================
// === CONFIG === (all tunables — change here, not in code)
// ============================================================
const CONFIG = {
  // Resolution / world
  LOGICAL_W: 960,
  LOGICAL_H: 540,
  TILE: 48,
  CHUNK_W: 8,    // tiles
  CHUNK_H: 11,   // tiles
  CHUNKS_AHEAD: 3,
  CHUNKS_BEHIND: 2,

  // Camera
  CAMERA_FOLLOW_RATIO: 0.35, // player rests at 35% from left

  // Player physics (logical units per second)
  RUN_SPEED: 288,                 // 6 tiles/sec
  JUMP_VELOCITY: -800,
  GRAVITY: 2000,
  MAX_FALL_SPEED: 1000,
  JUMP_CUT_FACTOR: 0.5,           // released-early velocity multiplier
  COYOTE_MS: 80,
  JUMP_BUFFER_MS: 80,
  STOMP_BOUNCE_FACTOR: 0.6,

  // Wolf visual + hitbox
  WOLF_BOX: 48,                   // visual bounding box (one tile)
  WOLF_HITBOX: { w: 32, h: 40, offsetX: 8, offsetY: 4 },
  WOLF_RUN_FRAME_MS: 100,         // 10 FPS run cycle
  WOLF_IDLE_BOB_AMP: 2,
  WOLF_IDLE_BOB_PERIOD_MS: 1500,

  // Power-up effects
  INVINCIBILITY_MS: 6000,
  SPEED_BOOST_MS: 5000,
  SPEED_BOOST_MULT: 1.7,
  SPEED_JUMP_MULT: 1.2,

  // Enemy behavior
  CHASER_DETECT_TILES_X: 8,
  CHASER_DETECT_TILES_Y: 3,
  CHASER_SPEED_MULT: 1.3,         // multiplied against RUN_SPEED
  CHASER_IDLE_BOB_AMP: 3,
  PUSHER_SPEED: 96,               // 2 tiles/sec
  PUSHER_PUSH_TILES: 4,           // forceful knockback
  PUSHER_PUSH_MS: 280,
  SNAIL_SPEED: 24,                // 0.5 tiles/sec
  STOMP_TOP_FRACTION: 0.25,       // top 25% counts as stomp zone

  // Collectibles
  COLLECT_CHECK_VALUE: 1,
  COLLECT_HEART_VALUE: 10,
  SNAIL_KILL_VALUE: 5,
  ENEMY_KILL_VALUES: { snail: 5, pusher: 15, chaser: 25 },
  COLLECT_BOB_AMP: 3,
  COLLECT_BOB_PERIOD_MS: 2000,

  // Power-up spawn rules
  POWERUP_BOB_AMP: 4,
  POWERUP_BOB_PERIOD_MS: 1400,
  POWERUP_MIN_CHUNKS_BETWEEN: 6,

  // Background ambient
  BAT_INTERVAL_MIN_MS: 8000,
  BAT_INTERVAL_MAX_MS: 20000,
  BAT_SPEED: 140,                 // logical units/sec
  BAT_BOB_AMP: 14,
  BAT_BOB_PERIOD_MS: 1800,
  RAINBOW_INTERVAL_MIN_MS: 30000,
  RAINBOW_INTERVAL_MAX_MS: 60000,
  RAINBOW_FADE_IN_MS: 1000,
  RAINBOW_HOLD_MS: 8000,
  RAINBOW_FADE_OUT_MS: 1000,
  SUN_BOB_AMP: 6,
  SUN_BOB_PERIOD_MS: 5000,

  // Parallax
  PARALLAX_FAR: 0.2,
  PARALLAX_NEAR: 0.5,

  // Difficulty by distance (meters == tiles)
  DIFFICULTY_BANDS: [
    { upTo: 300,    weights: { easy: 0.60, medium: 0.30, hard: 0.10 } },
    { upTo: 800,    weights: { easy: 0.30, medium: 0.50, hard: 0.20 } },
    { upTo: Infinity, weights: { easy: 0.15, medium: 0.45, hard: 0.40 } },
  ],

  // Audio
  SFX_VOLUME: 0.4,
  MUSIC_VOLUME: 0.15,
  MAX_CONCURRENT_SFX: 16,

  // Milestones
  MILESTONES: [
    { dist: 100,  text: "you're doing great ✅" },
    { dist: 250,  text: "still here, somehow" },
    { dist: 500,  text: "halfway through the workday" },
    { dist: 1000, text: "you're a machine 💖" },
    { dist: 2000, text: "okay this is concerning" },
    { dist: 5000, text: "log off. please." },
  ],

  // Start screen taglines
  TAGLINES: [
    "Slack is open. The dread is real.",
    "Just one more standup.",
    "You're fine. Probably.",
    "Inbox: 47 unread. Soul: similar.",
    "Calendar says 'optional'. It's not.",
    "You drafted the reply. You didn't send it.",
  ],

  // Death screen sub-epitaphs
  DEATH_SUBS: [
    "you almost had it (you didn't)",
    "the bat saw everything",
    "control was always an illusion",
    "tomorrow we ride again (we don't)",
    "👾 sends its regards",
    "this is fine",
    "the sea took you. she takes us all.",
    "should've taken the meeting",
  ],

  // Palette
  COLORS: {
    skyTop:        "#FFB88C",
    skyBottom:     "#FFE3B3",
    sea:           "#5BA8A0",
    seaHi:         "#F5E1A4",
    sandTop:       "#E8C988",
    sandSide:      "#B89968",
    sandShadow:    "#9E7E52",
    platform:      "#8B6F47",
    platformHi:    "#A88762",
    textDark:      "#3D2817",
    textAccent:    "#A04030",
    wolfBody:      "#8A8580",
    wolfBlotch:    "#D8D2C5",
    wolfShadow:    "#5C5853",
    wolfSnout:     "#6F6B65",
    wolfPink:      "#E89BA0",
    rainbowStripes: ["#E04848", "#E89048", "#E8D048", "#5BA458", "#4080C0", "#5040A0", "#9050C0"],
  },

  // Storage keys
  STORAGE: {
    bestScore:    "iw_best_score",
    bestDistance: "iw_best_distance",
    runs:         "iw_runs",
    muted:        "iw_muted",
  },
};

// ============================================================
// === STATE === (single game state object)
// ============================================================
const State = {
  // Top-level flow
  mode: "start",          // 'start' | 'playing' | 'paused' | 'dead'
  muted: false,

  // Timing
  time: 0,                // total ms since game start
  lastFrameMs: 0,

  // Camera
  cameraX: 0,             // logical units; left edge of viewport in world coords
  maxCameraX: 0,          // furthest right the camera has ever been (used to gate forward-only scroll)

  // Player
  player: null,           // populated by resetGame()

  // World
  chunks: [],             // array of chunk objects; each: { left, right, tiles, ents }
  nextChunkLeft: 0,       // tile X at which the next generated chunk starts
  lastHardWasIndex: -2,   // tracks "no two hard chunks in a row"
  lastPowerupChunkIdx: -CONFIG.POWERUP_MIN_CHUNKS_BETWEEN,
  chunkCount: 0,          // total chunks generated this run

  // Active entities (across chunks; chunks own their lists, this is a flat view)
  enemies: [],
  collectibles: [],
  powerups: [],

  // Particles / ephemera
  pickupPopups: [],       // floating "+1" / "+10" text
  dustPuffs: [],          // speed-boost dust
  ghosts: [],             // speed-boost ghost trail

  // Ambient
  bats: [],
  rainbow: null,          // { x, y, alpha, phase: 'in'|'hold'|'out', timer }
  nextBatMs: 0,
  nextRainbowMs: 0,

  // Score
  score: 0,
  collectibleScore: 0,
  distance: 0,            // in tiles ≈ meters
  bestScore: 0,
  bestDistance: 0,
  runs: 0,
  milestonesHit: new Set(),

  // Active power-up
  activePowerup: null,    // { type: 'invincibility'|'speed', timeLeft: ms }
};

function makePlayer(startTileX, startTileY) {
  return {
    x: startTileX * CONFIG.TILE,
    y: startTileY * CONFIG.TILE,
    vx: 0,
    vy: 0,
    w: CONFIG.WOLF_BOX,
    h: CONFIG.WOLF_BOX,
    onGround: false,
    facing: 1,
    state: "idle",        // 'idle' | 'run' | 'jumpRise' | 'jumpFall' | 'dying'
    runFrame: 0,
    runFrameTimer: 0,
    coyoteMs: 0,
    jumpBufferMs: 0,
    pushedMs: 0,          // active push timer (from 🥸)
    pushDx: 0,            // per-frame push velocity contribution
    dyingTimer: 0,
    dyingSpin: 0,
  };
}

// ============================================================
// === ASSETS === (sprite-swap stub; empty in v1)
// ============================================================
const Assets = {
  loaded: false,            // v1 stays false; sprite swap flips this in future
  sheets: {},               // future: { wolf: Image, enemies: Image, ... }
  frames: {},               // future: { wolf_run_0: { sheet, x, y, w, h }, ... }
  load: async function () { /* no-op in v1 */ },
};

// ============================================================
// === AUDIO === (Web Audio API: SFX + ambient music)
// ============================================================
const Audio = {
  ctx: null,
  sfxGain: null,
  musicGain: null,
  active: 0,                  // currently-playing SFX nodes
  music: { running: false, schedTimer: null, droneNodes: [] },

  ensure() {
    if (this.ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    this.ctx = new AC();
    this.sfxGain = this.ctx.createGain();
    this.sfxGain.gain.value = CONFIG.SFX_VOLUME;
    this.sfxGain.connect(this.ctx.destination);
    this.musicGain = this.ctx.createGain();
    this.musicGain.gain.value = CONFIG.MUSIC_VOLUME;
    this.musicGain.connect(this.ctx.destination);
    this.applyMute();
  },

  applyMute() {
    if (!this.ctx) return;
    const target = State.muted ? 0 : 1;
    this.sfxGain.gain.setTargetAtTime(target * CONFIG.SFX_VOLUME, this.ctx.currentTime, 0.01);
    this.musicGain.gain.setTargetAtTime(target * CONFIG.MUSIC_VOLUME, this.ctx.currentTime, 0.01);
  },

  // ---------- SFX ----------
  _envOsc({ type, freqStart, freqEnd, durSec, peakGain = 0.6, attackSec = 0.005 }) {
    if (!this.ctx || this.active >= CONFIG.MAX_CONCURRENT_SFX) return;
    this.active++;
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    osc.type = type;
    const g = this.ctx.createGain();
    osc.frequency.setValueAtTime(freqStart, now);
    if (freqEnd != null && freqEnd !== freqStart) {
      osc.frequency.exponentialRampToValueAtTime(Math.max(40, freqEnd), now + durSec);
    }
    g.gain.setValueAtTime(0.0001, now);
    g.gain.exponentialRampToValueAtTime(peakGain, now + attackSec);
    g.gain.exponentialRampToValueAtTime(0.0001, now + durSec);
    osc.connect(g).connect(this.sfxGain);
    osc.start(now);
    osc.stop(now + durSec + 0.05);
    osc.onended = () => { this.active = Math.max(0, this.active - 1); };
  },

  _noiseBurst({ durSec, peakGain = 0.4, lowpassHz = 800 }) {
    if (!this.ctx || this.active >= CONFIG.MAX_CONCURRENT_SFX) return;
    this.active++;
    const sr = this.ctx.sampleRate;
    const len = Math.max(1, Math.floor(durSec * sr));
    const buf = this.ctx.createBuffer(1, len, sr);
    const data = buf.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = this.ctx.createBufferSource();
    src.buffer = buf;
    const filter = this.ctx.createBiquadFilter();
    filter.type = "lowpass";
    filter.frequency.value = lowpassHz;
    const g = this.ctx.createGain();
    g.gain.value = peakGain;
    src.connect(filter).connect(g).connect(this.sfxGain);
    src.start();
    src.onended = () => { this.active = Math.max(0, this.active - 1); };
  },

  _arpeggio(freqs, stepSec, type = "sine", peakGain = 0.4) {
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime;
    freqs.forEach((f, i) => {
      if (this.active >= CONFIG.MAX_CONCURRENT_SFX) return;
      this.active++;
      const osc = this.ctx.createOscillator();
      osc.type = type;
      osc.frequency.value = f;
      const g = this.ctx.createGain();
      const start = t0 + i * stepSec;
      g.gain.setValueAtTime(0.0001, start);
      g.gain.exponentialRampToValueAtTime(peakGain, start + 0.005);
      g.gain.exponentialRampToValueAtTime(0.0001, start + stepSec * 0.95);
      osc.connect(g).connect(this.sfxGain);
      osc.start(start);
      osc.stop(start + stepSec + 0.05);
      osc.onended = () => { this.active = Math.max(0, this.active - 1); };
    });
  },

  play(name) {
    this.ensure();
    if (!this.ctx) return;
    switch (name) {
      case "jump":
        this._envOsc({ type: "square", freqStart: 440, freqEnd: 660, durSec: 0.08, peakGain: 0.35 });
        break;
      case "land":
        this._noiseBurst({ durSec: 0.05, peakGain: 0.25, lowpassHz: 400 });
        break;
      case "stomp":
        this._envOsc({ type: "square", freqStart: 600, freqEnd: 200, durSec: 0.12, peakGain: 0.4 });
        break;
      case "collect_check":
        this._envOsc({ type: "sine", freqStart: 800, freqEnd: 800, durSec: 0.06, peakGain: 0.4 });
        break;
      case "collect_heart":
        this._arpeggio([800, 1200], 0.075, "sine", 0.45);
        break;
      case "powerup":
        this._arpeggio([523, 659, 784, 1047], 0.05, "triangle", 0.4);
        break;
      case "death":
        this._envOsc({ type: "square", freqStart: 600, freqEnd: 80, durSec: 0.6, peakGain: 0.45 });
        break;
      case "push":
        this._envOsc({ type: "sine", freqStart: 200, freqEnd: 120, durSec: 0.1, peakGain: 0.45 });
        break;
      case "milestone":
        this._arpeggio([523, 659, 784], 0.12, "triangle", 0.35);
        break;
    }
  },

  // ---------- Music ----------
  startMusic() {
    this.ensure();
    if (!this.ctx || this.music.running) return;
    this.music.running = true;
    const ctx = this.ctx;

    // Drone: detuned sines at A2 (110Hz) and E3 (164.81Hz)
    const drone1 = ctx.createOscillator();
    drone1.type = "sine"; drone1.frequency.value = 110; drone1.detune.value = -7;
    const drone2 = ctx.createOscillator();
    drone2.type = "sine"; drone2.frequency.value = 164.81; drone2.detune.value = +5;
    const droneG = ctx.createGain();
    droneG.gain.value = 0.18;
    drone1.connect(droneG); drone2.connect(droneG); droneG.connect(this.musicGain);
    drone1.start(); drone2.start();
    this.music.droneNodes = [drone1, drone2, droneG];

    // Arpeggio scheduler: A major 7 — A3, C#4, E4, G#4
    const notes = [220.00, 277.18, 329.63, 415.30];
    let step = 0;
    const stepSec = 1.3;       // ~46 BPM, slightly more movement than before
    const sched = () => {
      if (!this.music.running) return;
      const t = ctx.currentTime;
      const f = notes[step % notes.length];

      // Piano-ish fundamental: triangle with very fast attack and long
      // exponential decay, tiny random detune for lo-fi tape warble.
      const o1 = ctx.createOscillator();
      o1.type = "triangle";
      o1.frequency.value = f;
      o1.detune.value = (Math.random() - 0.5) * 4; // ±2 cents
      const g1 = ctx.createGain();
      g1.gain.setValueAtTime(0.0001, t);
      g1.gain.linearRampToValueAtTime(0.14, t + 0.006);
      g1.gain.exponentialRampToValueAtTime(0.0001, t + 2.4);
      o1.connect(g1).connect(this.musicGain);
      o1.start(t);
      o1.stop(t + 2.5);

      // Octave harmonic (sine, lower amp) — adds a touch of piano brightness
      const o2 = ctx.createOscillator();
      o2.type = "sine";
      o2.frequency.value = f * 2;
      const g2 = ctx.createGain();
      g2.gain.setValueAtTime(0.0001, t);
      g2.gain.linearRampToValueAtTime(0.045, t + 0.004);
      g2.gain.exponentialRampToValueAtTime(0.0001, t + 1.3);
      o2.connect(g2).connect(this.musicGain);
      o2.start(t);
      o2.stop(t + 1.4);

      step++;

      // occasional shimmer (~30% chance per step)
      if (Math.random() < 0.3) {
        const sFreq = notes[Math.floor(Math.random() * notes.length)] * 4;
        const sOsc = ctx.createOscillator();
        sOsc.type = "sine";
        sOsc.frequency.value = sFreq;
        const sG = ctx.createGain();
        const sStart = t + 0.3 + Math.random() * 0.6;
        sG.gain.setValueAtTime(0.0001, sStart);
        sG.gain.exponentialRampToValueAtTime(0.04, sStart + 0.05);
        sG.gain.exponentialRampToValueAtTime(0.0001, sStart + 1.0);
        sOsc.connect(sG).connect(this.musicGain);
        sOsc.start(sStart);
        sOsc.stop(sStart + 1.2);
      }
    };
    sched();
    this.music.schedTimer = setInterval(sched, stepSec * 1000);
  },

  stopMusic() {
    if (!this.music.running) return;
    this.music.running = false;
    if (this.music.schedTimer) clearInterval(this.music.schedTimer);
    this.music.schedTimer = null;
    this.music.droneNodes.forEach(n => { try { n.stop && n.stop(); } catch(e) {} try { n.disconnect(); } catch(e) {} });
    this.music.droneNodes = [];
  },

  pauseMusic() { this.stopMusic(); },
  resumeMusic() { this.startMusic(); },
};

// ============================================================
// === INPUT === (keyboard + touch)
// ============================================================
const Input = {
  left: false,
  right: false,
  jump: false,
  jumpEdge: false,        // true on the frame jump was first pressed (consumed by physics)

  _bindKeys() {
    window.addEventListener("keydown", (e) => {
      if (e.repeat) return;
      switch (e.code) {
        case "ArrowLeft":
        case "KeyA":
          this.left = true; e.preventDefault(); break;
        case "ArrowRight":
        case "KeyD":
          this.right = true; e.preventDefault(); break;
        case "ArrowUp":
        case "KeyW":
        case "Space":
          if (!this.jump) this.jumpEdge = true;
          this.jump = true; e.preventDefault();
          break;
        case "KeyP":
        case "Escape":
          if (State.mode === "playing") UI.pause();
          else if (State.mode === "paused") UI.resume();
          e.preventDefault();
          break;
        case "KeyR":
          if (State.mode === "dead") UI.restart();
          break;
      }
    });
    window.addEventListener("keyup", (e) => {
      switch (e.code) {
        case "ArrowLeft":
        case "KeyA":
          this.left = false; break;
        case "ArrowRight":
        case "KeyD":
          this.right = false; break;
        case "ArrowUp":
        case "KeyW":
        case "Space":
          this.jump = false; break;
      }
    });
  },

  _bindTouch() {
    // Detect touch availability and tag body
    const hasTouch = ("ontouchstart" in window) || (navigator.maxTouchPoints > 0);
    if (hasTouch) document.body.classList.add("touch");

    const bindBtn = (el, onDown, onUp) => {
      if (!el) return;
      const down = (e) => { e.preventDefault(); el.classList.add("pressed"); onDown(); };
      const up   = (e) => { e.preventDefault(); el.classList.remove("pressed"); onUp(); };
      el.addEventListener("touchstart", down, { passive: false });
      el.addEventListener("touchend",   up,   { passive: false });
      el.addEventListener("touchcancel",up,   { passive: false });
      // Also handle mouse for desktop debugging of touch UI
      el.addEventListener("mousedown",  down);
      el.addEventListener("mouseup",    up);
      el.addEventListener("mouseleave", up);
    };

    bindBtn(document.getElementById("btn-left"),
      () => { this.left = true; },
      () => { this.left = false; });
    bindBtn(document.getElementById("btn-right"),
      () => { this.right = true; },
      () => { this.right = false; });
    bindBtn(document.getElementById("btn-jump"),
      () => { if (!this.jump) this.jumpEdge = true; this.jump = true; },
      () => { this.jump = false; });

    // Suppress context menu on long-press on canvas
    const canvas = document.getElementById("game");
    canvas.addEventListener("contextmenu", (e) => e.preventDefault());
    // Stop double-tap zoom on the stage
    document.getElementById("stage").addEventListener("touchmove", (e) => e.preventDefault(), { passive: false });
  },

  consumeJumpEdge() {
    const v = this.jumpEdge;
    this.jumpEdge = false;
    return v;
  },

  reset() {
    this.left = this.right = this.jump = this.jumpEdge = false;
  },

  init() {
    this._bindKeys();
    this._bindTouch();
  },
};
